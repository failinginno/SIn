<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SINGULAR · 管理员控制台（测试网）</title><link rel="stylesheet" href="app/admin-testnet.css"></head><body><main><header><img src="assets/singular-logo.png" alt="SINGULAR"><span>ADMIN CONSOLE · BSC TESTNET</span></header><h1>奖池与协议费用</h1><p class="intro">仅连接固定管理员钱包后显示操作。每项操作都需在 MetaMask 中独立确认；本页不会读取私钥，也不在官网导航中公开。</p><div class="warn">连接管理员钱包后会核对当前测试网合约是否支持自动续池。只有核对通过，页面才会显示自动续建选项；首次创建奖池仍需钱包确认。</div><section><h2>01 / 钱包核验</h2><button id="connect">连接 MetaMask</button><p id="identity">未连接</p></section><div id="controls" hidden><section><h2>02 / 创建固定参数奖池</h2><div class="grid"><label>单张票价 (tBNB)<input id="price" value="0.001" inputmode="decimal"></label><label>容量（张）<input id="capacity" value="2" inputmode="numeric"></label><label>奖金 (tBNB)<input id="prize" value="0.0018" inputmode="decimal"></label><label>协议费 (tBNB)<input id="fee" value="0.0002" inputmode="decimal"></label><label>首张票后时长（分钟）<input id="duration" value="30" inputmode="numeric"></label></div><p>票价 × 容量必须恰好等于奖金 + 协议费；参数提交后不可更改。</p><button id="create">核对并创建奖池</button></section><section><h2>03 / 协议费</h2><div class="grid"><label>已开奖奖池 ID<input id="poolId" inputmode="numeric" placeholder="例如 3"></label><div><button id="readFee">读取费用状态</button></div></div><p id="feeState">先读取奖池费用。</p><button id="sweep" disabled>划转该池协议费至 Fee Vault</button><button id="withdraw" disabled>领取 Fee Vault 全部可用协议费</button><p>未开奖、未结算的用户奖金和退款不能作为协议费提取。</p></section></div><section><h2>执行记录</h2><pre id="log" aria-live="polite">尚未操作。</pre></section></main><script src="app/runtime-env.js"></script><script src="app/testnet-config.js"></script><script src="app/admin-testnet.js"></script></body></html>
